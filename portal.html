<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Portal do Cliente - AGF Jose Bonifacio</title>
    <style id="approved-client-theme">
      :root{--approved-blue:#0a4b78;--approved-bg:#f7f8fb;--approved-line:#e7eaf0;--approved-text:#162036;}
      .client-auth{grid-template-columns:1fr!important;place-items:center!important;background:#003b66!important;padding:24px!important;}
      .auth-copy{display:none!important;}
      .auth-panel{width:min(420px,100%)!important;margin:0!important;padding:30px!important;border-radius:22px!important;border:1px solid #d8dde6!important;background:#fff!important;box-shadow:0 24px 80px rgba(9,29,56,.18)!important;}
      .approved-login-logo{display:block;width:min(330px,100%);height:auto;margin:0 auto 24px;}
      .auth-panel h2{margin:0 0 24px!important;text-align:center!important;color:var(--approved-blue)!important;font-size:26px!important;}
      .auth-panel>p{display:none!important;}
      .auth-panel .form-stack{gap:14px!important;}
      .auth-panel .field>span{font-size:12px!important;font-weight:850!important;color:#5d6573!important;}
      .auth-panel .field input{min-height:52px!important;border-radius:14px!important;border:1px solid #cfd6e1!important;padding:0 14px!important;}
      .auth-panel .primary{min-height:52px!important;border-radius:14px!important;background:var(--approved-blue)!important;font-size:16px!important;}
      .auth-panel #local-client{border-radius:14px!important;}
      .portal-shell{grid-template-columns:238px minmax(0,1fr)!important;background:var(--approved-bg)!important;}
      .portal-sidebar{padding:18px 14px!important;border-right:1px solid var(--approved-line)!important;}
      .portal-brand{display:block!important;padding:2px 8px 24px!important;}
      .portal-brand .brand-mark,.portal-brand>div:last-child{display:none!important;}
      .approved-sidebar-logo{display:block;width:100%;max-width:205px;height:auto;margin:0 auto;}
      .portal-nav{gap:5px!important;}
      .portal-nav button{border-radius:10px!important;padding:11px 12px!important;color:#566176!important;font-weight:800!important;}
      .portal-nav button.active{background:#eef5ff!important;color:#1f67d2!important;}
      .portal-topbar{height:68px!important;padding:0 24px!important;background:#fff!important;border-bottom:1px solid var(--approved-line)!important;}
      .portal-content{padding:18px 22px 34px!important;}
      .card{border-radius:15px!important;border-color:var(--approved-line)!important;box-shadow:0 8px 24px rgba(28,45,72,.06)!important;}
      .status{white-space:normal!important;text-align:center!important;line-height:1.25!important;}
      .dce-card header{flex-wrap:wrap!important;}
      .dce-card header .status{margin-left:auto!important;max-width:180px!important;}
      .progress-track i{background:#7d42c7;}
      .progress-row:nth-child(2) .progress-track i{background:#1f67d2;}
      .progress-row:nth-child(3) .progress-track i{background:#f47416;}
      .progress-row:nth-child(4) .progress-track i{background:#1d3354;}
      .progress-row:nth-child(5) .progress-track i{background:#219653;}
      .timeline{position:relative;padding-left:20px;}
      .timeline:before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:3px;background:#e6edf7;border-radius:999px;}
      .timeline-item{position:relative;grid-template-columns:120px 1fr auto!important;padding:14px 0 14px 16px!important;}
      .timeline-item:before{content:"";position:absolute;left:-20px;top:20px;width:10px;height:10px;border-radius:50%;background:#1f67d2;box-shadow:0 0 0 5px #edf5ff;}
      @media(max-width:760px){
        .client-auth{padding:14px!important;}
        .auth-panel{padding:24px 18px!important;border-radius:18px!important;}
        .portal-shell{display:block!important;}
        .portal-sidebar{display:none!important;}
        .portal-topbar{height:60px!important;padding:0 14px!important;}
        .portal-content{padding:12px!important;}
        .dce-card header{flex-direction:column!important;align-items:flex-start!important;}
        .dce-card header .status{margin-left:0!important;max-width:100%!important;}
        .timeline-item{grid-template-columns:1fr!important;gap:5px!important;}
      }
    </style>
  </head>

      function ensureImage(parent, className) {
        if (!parent || parent.querySelector('.'+className)) return;
        const img=document.createElement('img'); img.className=className; img.src=APPROVED_LOGO; img.alt='AGF Jose Bonifacio e Correios'; parent.prepend(img);
      }
      function applyApprovedClientUI() {
        const auth=document.querySelector('.auth-panel');
        if(auth) {
          ensureImage(auth,'approved-login-logo');
          const title=auth.querySelector('h2'); if(title) title.textContent='Acessar Portal';
          const form=auth.querySelector('#client-login');
          if(form) {
            const first=form.querySelector('.field');
            const label=first?.querySelector('span'); if(label) label.textContent='Usuario';
            const input=first?.querySelector('input'); if(input) input.placeholder='Digite seu usuario';
            const button=form.querySelector('button[type="submit"]'); if(button) button.textContent='Entrar';
          }
        }
        const brand=document.querySelector('.portal-brand');
        if(brand) ensureImage(brand,'approved-sidebar-logo');
        document.querySelectorAll('.profile-modal .info-strip').forEach(el=>{el.innerHTML=el.innerHTML.replace(/pacote fiscal/gi,'lote fiscal');});
      }
      applyApprovedClientUI();
      const observer=new MutationObserver(()=>applyApprovedClientUI());
      observer.observe(document.body,{subtree:true,childList:true});
    </script>

name: Auditar fluxo operacional no navegador

on:
  pull_request:
    paths:
      - 'src/**'
      - 'eleicoes.html'
      - 'tests/e2e/**'
      - '.github/workflows/e2e-operations.yml'
  workflow_dispatch:

jobs:
  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Playwright sem alterar o projeto
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Iniciar aplicação local
        run: |
          npm run preview -- --host 0.0.0.0 > /tmp/agf-preview.log 2>&1 &
          echo $! > /tmp/agf-preview.pid
          for tentativa in $(seq 1 60); do
            if curl -fsS http://localhost:4173/eleicoes.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/agf-preview.log
          exit 1
      - name: Adaptar entrada local do teste
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/operations-flow.spec.mjs')
          source = path.read_text(encoding='utf-8')
          old = """  await page.goto(APP_URL);\n  await expect(page.getByText('Passo a passo da operação')).toBeVisible();"""
          new = """  await page.goto(APP_URL);\n  const localLogin = page.locator('#local-login');\n  try {\n    await localLogin.waitFor({ state: 'visible', timeout: 3_000 });\n    await localLogin.click();\n  } catch {}\n  await expect(page.locator('[data-operation-nav]')).toBeVisible({ timeout: 30_000 });"""
          if old not in source:
              raise SystemExit('Trecho de entrada local não localizado no teste.')
          source = source.replace(old, new)
          source = source.replace(
              "await expect(page.getByText('SEDEX_250_26.08.csv')).toBeVisible({ timeout: 30_000 });",
              "await expect(page.getByRole('cell', { name: 'SEDEX_250_26.08.csv' })).toBeVisible({ timeout: 30_000 });",
          )
          source = source.replace(
              "await expect(page.getByText('Arquivos prontos para o Portal Postal.')).toBeVisible();\n\n  await clickStage(page, 2);",
              "await expect(page.getByText('Arquivos prontos para o Portal Postal.')).toBeVisible();\n  await page.waitForTimeout(1_500);\n  await expect(page.locator('[data-operation-nav]')).toBeVisible({ timeout: 30_000 });\n\n  await clickStage(page, 2);",
          )
          source = source.replace("[data-region-overlay]", "[data-overlay]")
          source = source.replace("[data-postage-mark]", "[data-stamp]")
          source = source.replace("[data-save-setup]", "[data-save]")
          source = source.replace(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z4i8AAAAASUVORK5CYII=",
              "iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR4nGNkYGD4z8DAwMDEAAUADigBA0dwHFEAAAAASUVORK5CYII=",
          )
          source = source.replace(
              "  await expect(overlay).toBeVisible({ timeout: 30_000 });",
              "  await expect(overlay).toBeVisible({ timeout: 30_000 });\n  await expect(page.locator('.label-preview-loading')).toHaveCount(0, { timeout: 30_000 });",
          )
          source = source.replace(
              "  await page.locator('[data-font-scale]').fill('0.80');",
              "  await expect(page.locator('[data-check-stamp]')).toHaveClass(/ok/, { timeout: 10_000 });\n  await expect(page.locator('[data-check-region]')).toHaveClass(/ok/);\n  await page.locator('[data-font-scale]').fill('0.80');",
          )
          source = source.replace(
              "  await page.getByRole('button', { name: 'Gerar Declaração Simplificada' }).click();\n  await expect(page.locator('[data-volumes=\"prod-active\"]')).toBeVisible({ timeout: 30_000 });",
              "  await page.getByRole('button', { name: 'Gerar Declaração Simplificada' }).click();\n  const reloadedLocalLogin = page.locator('#local-login');\n  try {\n    await reloadedLocalLogin.waitFor({ state: 'visible', timeout: 8_000 });\n    await reloadedLocalLogin.click();\n  } catch {}\n  await expect(page.locator('[data-operation-nav]')).toBeVisible({ timeout: 30_000 });\n  if (await page.locator('[data-volumes=\"prod-active\"]').count() === 0) {\n    await page.locator('[data-operation-stage=\"7\"]').click();\n  }\n  await expect(page.locator('[data-volumes=\"prod-active\"]')).toBeVisible({ timeout: 30_000 });",
          )
          path.write_text(source, encoding='utf-8')
          PY
      - name: Percorrer o fluxo completo
        run: npx playwright test tests/e2e/operations-flow.spec.mjs --workers=1 --repeat-each=1 --max-failures=1 --reporter=line
      - name: Mostrar log do servidor em caso de falha
        if: failure()
        run: cat /tmp/agf-preview.log || true

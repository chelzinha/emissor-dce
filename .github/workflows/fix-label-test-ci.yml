name: Ajustar correção da etiqueta teste

on:
  push:
    branches:
      - fix/label-test-loop
    paths:
      - scripts/fix-label-test-ci.mjs
      - .github/workflows/fix-label-test-ci.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/label-test-loop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar ajustes
        run: node scripts/fix-label-test-ci.mjs
      - name: Remover arquivos temporários
        run: rm scripts/fix-label-test-ci.mjs .github/workflows/fix-label-test-ci.yml
      - name: Commitar ajustes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajustar correção da etiqueta teste"
          git push origin HEAD:fix/label-test-loop

name: Apply stage 1-8 revamp

on:
  push:
    branches:
      - revamp/etapas-1-a-8

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize revamp
        shell: bash
        run: |
          set -euo pipefail
          cat .revamp/part*.b64 | base64 -d > /tmp/revamp.tar.gz
          tar -xzf /tmp/revamp.tar.gz
          rm -rf .revamp
          rm -f .github/workflows/apply-revamp.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit materialized changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Organizar fluxo operacional até a entrega"
          git push origin HEAD:revamp/etapas-1-a-8

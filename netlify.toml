[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[context.deploy-preview]
  command = "node --test tests/finance-import.test.mjs tests/finance-report.test.mjs tests/finance-contract.test.mjs tests/client-finance-highlights.test.mjs tests/client-cnpj-temp.test.mjs tests/client-portal-redesign.test.mjs tests/operations-backend-routing.test.mjs tests/dynamic-modules-navigation.test.mjs && npm run build"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[redirects]]
  from = "/portal"
  to = "/portal.html"
  status = 200
[[redirects]]
  from = "/portal/*"
  to = "/portal.html"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.netlify.app https://*.netlify.com; worker-src 'self' blob:; manifest-src 'self'"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
